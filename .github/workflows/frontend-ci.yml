name: frontend-ci

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-and-security-audit:
        runs-on: ubuntu-latest

        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

        env:
            NODE_VERSION: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4

              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Security audit
              run: npm audit --audit-level=high

            - name: Run lint
              run: npm run lint

    docker-build:
        runs-on: ubuntu-latest
        needs: lint-and-security-audit

        if: |
            (github.ref_name == 'main' && github.event_name == 'push') ||
            (github.event_name == 'workflow_dispatch')

        env:
            IMAGE_NAME: wdoc-frontend
            TRIVY_CACHE_DIR: /tmp/trivy-cache

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache Trivy DB
              uses: actions/cache@v4

              with:
                  path: ${{ env.TRIVY_CACHE_DIR }}
                  key: ${{ runner.os }}-trivy-db
                  restore-keys: |
                      ${{ runner.os }}-trivy-db

            - name: Login to Docker Hub
              uses: docker/login-action@v3

              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker Image (local)
              uses: docker/build-push-action@v6

              with:
                  context: .
                  push: false
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master

              with:
                  image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  severity: "CRITICAL,HIGH"
                  cache-dir: ${{ env.TRIVY_CACHE_DIR }}

            - name: Push Docker Image
              uses: docker/build-push-action@v6

              with:
                  context: .
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    trigger-cd:
        runs-on: ubuntu-latest
        needs: docker-build

        if: |
            (github.ref_name == 'main' && github.event_name == 'push') || 
            (github.event_name == 'workflow_dispatch')

        steps:
            - name: Trigger CD Workflow
              uses: peter-evans/repository-dispatch@v3

              with:
                  token: ${{ secrets.PAT_TOKEN }}
                  repository: whatislavx/world-of-development-of-opportunities-and-change-infra
                  event-type: trigger-deploy
                  client-payload: |
                      {
                        "ref": "${{ github.ref_name }}",
                        "sha": "${{ github.sha }}",
                        "service": "frontend"
                      }
