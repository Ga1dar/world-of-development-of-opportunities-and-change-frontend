name: frontend-ci

on:
  push:
    branches:
      - develop
      - main
      - feature/**
      - chore/**
      - hotfix/**

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint (non-blocking)
        run: npm run lint || true

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4

        with:
          name: frontend-build
          path: dist

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4

        with:
          name: frontend-build
          path: ./dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6

        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/world-of-development-of-opportunities-and-change-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/world-of-development-of-opportunities-and-change-frontend:${{ github.sha }}

  trigger-cd:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Trigger CD Workflow
        uses: peter-evans/repository-dispatch@v3

        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: whatislavx/world-of-development-of-opportunities-and-change-infra
          event-type: trigger-deploy
          client-payload: |
            {
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}"
            }
